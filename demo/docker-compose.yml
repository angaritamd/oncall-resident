# Run with: docker compose -p oncall-resident up -d --build
# Separate project, network and volume. Ports never bind to 0.0.0.0:
#   app     -> 127.0.0.1:13000       (published to the tailnet over HTTPS by `tailscale serve`, never Funnel)
#   core    -> 127.0.0.1:18000       (debug only; the app reaches it on the internal network)
#   orthanc -> 127.0.0.1:18042       (DICOMweb/REST for seeding and debug; DICOM 4242 not published)
#   viewer  -> 127.0.0.1:13030       (OHIF static + read-only DICOMweb gateway; `tailscale serve --https=8443`)
# Every service: non-root user, all capabilities dropped, no privilege escalation, read-only root fs.
# Orthanc requires HTTP basic auth and the app requires an allowed Tailscale-User-Login; both are set in
# demo/.env (git-ignored, see .env.example).
name: oncall-resident

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  orthanc:
    <<: *hardening
    build:
      context: ./orthanc
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      # only DICOMweb is needed; disable the plugins the image enables by default
      GDCM_PLUGIN_ENABLED: "false"
      ORTHANC_EXPLORER_2_ENABLED: "false"
      ORTHANC__NAME: "oncall-resident-demo"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USER:?set in demo/.env}": "${ORTHANC_PASSWORD:?set in demo/.env}"}'
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      # BulkDataURI and other absolute WADO-RS URLs point at the public viewer origin (gateway via Serve)
      ORTHANC__DICOM_WEB__HOST: "${VIEWER_HOST:-}"
      ORTHANC__DICOM_WEB__SSL: "${VIEWER_SSL:-false}"
      VERBOSE_STARTUP: "false"
    volumes:
      - orthanc-db:/var/lib/orthanc/db
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:18042:8042"
    networks: [pacs]

  core:
    <<: *hardening
    build:
      context: ..
      dockerfile: core/Dockerfile
    environment:
      DICOMWEB_URL: "http://orthanc:8042/dicom-web"
      DICOMWEB_USER: "${ORTHANC_USER:?set in demo/.env}"
      DICOMWEB_PASSWORD: "${ORTHANC_PASSWORD:?set in demo/.env}"
      # resident model chain: Glimmer (serving/, scale-to-zero) -> Meta Model API -> basic rule mode
      GLIMMER_BASE_URL: "${GLIMMER_BASE_URL:-}"
      GLIMMER_API_KEY: "${GLIMMER_API_KEY:-}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      # the external backup only runs when this is "synthetic" AND cases.json is marked synthetic
      DATA_CLASSIFICATION: "${DATA_CLASSIFICATION:-}"
      # voice: meta (Muse Voice Transcribe, synthetic data only, same gate) | local (Whisper on the node; interface only)
      TRANSCRIBE_PROVIDER: "${TRANSCRIBE_PROVIDER:-meta}"
      WHISPER_URL: "${WHISPER_URL:-}"
      # day boundary for "Firmados hoy"
      SHIFT_TZ: "${SHIFT_TZ:-UTC}"
      # the model's QC runs in the background after a change (signing waits for it)
      QC_BACKGROUND: "${QC_BACKGROUND:-1}"
      # an active radiologist (list, case, mic) renews a warm Glimmer with GET /models at most this often
      GLIMMER_KEEPALIVE_SECONDS: "${GLIMMER_KEEPALIVE_SECONDS:-120}"
      # demo only: lets ADMIN_USERS reload the synthetic draft reports to replay the QC demo
      DEMO_RESET_ENABLED: "${DEMO_RESET_ENABLED:-0}"
      # public URL of the reading-station viewer (tailscale serve --https=8443 -> viewer-gateway)
      VIEWER_URL: "${VIEWER_URL:-}"
      GLIMMER_COLD_THRESHOLD: "${GLIMMER_COLD_THRESHOLD:-20}"
    volumes:
      - core-state:/data
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:18000:8000"
    depends_on: [orthanc]
    networks: [pacs, edge]

  app:
    <<: *hardening
    build:
      context: ../app
    environment:
      CORE_URL: "http://core:8000"
      # tailnet logins allowed in (comma-separated); empty means nobody gets in
      ALLOWED_USERS: "${ALLOWED_USERS:?set in demo/.env}"
      # logins that also see which model answered each tool call (Activity); optional
      ADMIN_USERS: "${ADMIN_USERS:-}"
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    ports:
      - "127.0.0.1:13000:3000"
    depends_on: [core]
    # the app trusts Tailscale-User-Login, so only the core shares its network (Orthanc cannot reach it)
    networks: [edge]

  # reading station (ANG-177): OHIF's static build served by our gateway, reachable only via
  # `tailscale serve --https=8443`; it shares a network only with Orthanc
  viewer-gateway:
    <<: *hardening
    build:
      context: ./viewer
      dockerfile: Dockerfile.gateway
    environment:
      ALLOWED_USERS: "${ALLOWED_USERS:?set in demo/.env}"
      ORTHANC_URL: "http://orthanc:8042"
      ORTHANC_USER: "${ORTHANC_USER:?set in demo/.env}"
      ORTHANC_PASSWORD: "${ORTHANC_PASSWORD:?set in demo/.env}"
      OHIF_DIR: "/srv/ohif"
      # only the app may frame the viewer
      APP_ORIGIN: "${APP_ORIGIN:-}"
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:13030:8000"
    depends_on: [orthanc]
    networks: [pacs]

networks:
  pacs: {}
  edge: {}

volumes:
  orthanc-db:
  core-state:
