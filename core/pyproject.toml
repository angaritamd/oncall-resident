[project]
name = "oncall-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn[standard]==0.54.0", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", ".."]
