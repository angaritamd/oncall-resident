name: scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Scan (gitleaks + denylist + PHI)
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: scripts/scan.sh --all
      - name: Scan commit messages for denylist terms
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          printf '%s\n' "$DENYLIST" | sed '/^[[:space:]]*$/d' > /tmp/terms
          fail=0
          for sha in $(git rev-list HEAD); do
            if git log -1 --format=%B "$sha" | grep -q -i -F -f /tmp/terms; then echo "commit ${sha:0:7}: término de la denylist"; fail=1; fi
          done
          rm -f /tmp/terms
          exit $fail
