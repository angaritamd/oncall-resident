name: scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Scan (gitleaks + denylist + PHI)
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: scripts/scan.sh --all
      - name: Denylist matcher tests
        run: scripts/test-denylist.sh
      - name: Scan commit messages for denylist terms
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          fail=0
          for sha in $(git rev-list HEAD); do
            if ! hits=$(git log -1 --format=%B "$sha" | scripts/denylist-match.sh); then
              echo "commit ${sha:0:7}: denylist check failed"; fail=1
            elif [ -n "$hits" ]; then
              echo "commit ${sha:0:7}: término de la denylist"; fail=1
            fi
          done
          exit $fail

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Core tests
        working-directory: core
        run: uv run --locked pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: App unit tests (auth rules)
        working-directory: app
        run: npm run test:unit
